<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitget Automated Trading Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #f0b90b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f0b90b;
            border: none;
            border-radius: 4px;
            color: #121212;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d4a305;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bitget Trading Panel</h2>
    <form id="tradeForm">
        <div class="form-group">
            <label>API Key</label>
            <input type="text" id="apiKey" required placeholder="Enter Bitget API Key">
        </div>
        <div class="form-group">
            <label>Secret Key</label>
            <input type="password" id="secretKey" required placeholder="Enter Bitget Secret Key">
        </div>
        <div class="form-group">
            <label>Passphrase</label>
            <input type="password" id="passphrase" required placeholder="Enter API Passphrase">
        </div>
        <div class="form-group">
            <label>Symbol</label>
            <input type="text" id="symbol" value="BTCUSDT" required>
        </div>
        <div class="form-group">
            <label>Side</label>
            <select id="side">
                <option value="buy">BUY / LONG</option>
                <option value="sell">SELL / SHORT</option>
            </select>
        </div>
        <div class="form-group">
            <label>Size (Quantity / USDT)</label>
            <input type="text" id="size" placeholder="e.g. 0.001 or min 1 USDT value" required>
        </div>
        <button type="submit">Execute Market Order</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('tradeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#f0b90b';
        statusDiv.innerText = 'Executing order...';

        const payload = {
            apiKey: document.getElementById('apiKey').value.trim(),
            secretKey: document.getElementById('secretKey').value.trim(),
            passphrase: document.getElementById('passphrase').value.trim(),
            symbol: document.getElementById('symbol').value.trim(),
            side: document.getElementById('side').value,
            size: document.getElementById('size').value.trim()
        };

        try {
            const response = await fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                statusDiv.style.color = '#0ecb81';
                statusDiv.innerText = 'Trade Executed Successfully!';
            } else {
                statusDiv.style.color = '#f6465d';
                statusDiv.innerText = 'Error: ' + (result.error || 'Unknown error');
            }
        } catch (err) {
            statusDiv.style.color = '#f6465d';
            statusDiv.innerText = 'Network Error: ' + err.message;
        }
    });
</script>

</body>
</html>
