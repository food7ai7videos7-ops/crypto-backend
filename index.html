<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Terminal & Exchange</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-blue: #1f6feb;
            --accent-yellow: #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
        }

        .wallet-info {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }

        .wallet-info span {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        @media(max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Market Ticker Grid */
        .ticker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .ticker-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .ticker-card:hover {
            border-color: var(--accent-blue);
        }

        .ticker-symbol {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .ticker-price {
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        /* Trading Form */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
        }

        .btn-buy { background-color: var(--accent-green); }
        .btn-sell { background-color: var(--accent-red); }
        .btn-action { background-color: var(--accent-blue); width: 100%; margin-top: 10px;}

        button:active {
            opacity: 0.8;
        }

        /* Positions Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: var(--text-muted); }

        /* Admin & Config Panel */
        .config-section {
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ CRYPTO TERMINAL V2</div>
        <div class="wallet-info">
            <div>Balance: $<span id="user-balance">10,000.00</span></div>
            <div>PnL: $<span id="total-pnl" class="positive">0.00</span></div>
        </div>
    </header>

    <div class="main-container">
        <!-- Left Side: Ticker & Active Positions -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="panel">
                <h2>Live Market (Bitget Ticker)</h2>
                <div class="ticker-grid" id="ticker-container">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Connecting to Bitget WebSocket...</div>
                </div>
            </div>

            <div class="panel">
                <h2>Open Positions / History</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Asset</th>
                                <th>Type</th>
                                <th>Entry</th>
                                <th>Size</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="positions-list">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">No open positions</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Side: Trade Execution & Telegram/Admin Tools -->
        <div class="panel">
            <h2>Place Order</h2>
            <div class="form-group">
                <label>Selected Pair</label>
                <input type="text" id="selected-pair" value="BTCUSDT" readonly>
            </div>
            <div class="form-group">
                <label>Current Price ($)</label>
                <input type="text" id="current-price" value="0.00" readonly>
            </div>
            <div class="form-group">
                <label>Amount (USDT)</label>
                <input type="number" id="trade-amount" value="100">
            </div>
            <div class="form-group">
                <label>Leverage</label>
                <select id="leverage">
                    <option value="1">1x (Spot)</option>
                    <option value="5">5x</option>
                    <option value="10" selected>10x</option>
                    <option value="20">20x</option>
                    <option value="50">50x</option>
                </select>
            </div>

            <div class="btn-row">
                <button class="btn-buy" onclick="executeTrade('BUY')">LONG / BUY</button>
                <button class="btn-sell" onclick="executeTrade('SELL')">SHORT / SELL</button>
            </div>

            <!-- Deposit / Withdrawal & Admin Config -->
            <div class="config-section">
                <h2>Wallet & Admin Controls</h2>
                <div class="form-group">
                    <label>Withdrawal / Deposit Amount</label>
                    <input type="number" id="wallet-amount" placeholder="Enter amount">
                </div>
                <button class="btn-action" style="background-color: var(--accent-yellow); color: #000;" onclick="handleTransaction('Deposit')">Deposit Funds</button>
                <button class="btn-action" style="background-color: var(--accent-red);" onclick="handleTransaction('Withdrawal')">Request Withdrawal</button>
            </div>

            <div class="config-section">
                <h2>Telegram Bot Integration</h2>
                <div class="form-group">
                    <label>Bot Token</label>
                    <input type="text" id="tg-token" placeholder="Enter Telegram Bot Token">
                </div>
                <div class="form-group">
                    <label>Chat ID</label>
                    <input type="text" id="tg-chatid" placeholder="Enter Chat ID">
                </div>
                <button class="btn-action" onclick="saveTelegramConfig()">Save & Test Notification</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 10000.00;
        let activePositions = [];
        let currentSymbol = "BTCUSDT";
        let currentLivePrice = 65000.00;

        // Fetch Live Ticker Data from Bitget Public API
        async function fetchBitgetPrices() {
            try {
                let response = await fetch('https://api.bitget.com/api/v2/spot/market/tickers');
                let data = await response.json();
                if(data && data.data) {
                    let container = document.getElementById('ticker-container');
                    container.innerHTML = '';
                    
                    // Filter major USDT pairs
                    let pairs = data.data.filter(item => item.symbol.endsWith('USDT')).slice(0, 16);
                    
                    pairs.forEach(item => {
                        let price = parseFloat(item.lastPr).toFixed(2);
                        let change = parseFloat(item.change24h || 0).toFixed(2);
                        let isPositive = change >= 0;

                        if(item.symbol === currentSymbol) {
                            currentLivePrice = parseFloat(price);
                            document.getElementById('current-price').value = currentLivePrice;
                        }

                        let card = document.createElement('div');
                        card.className = 'ticker-card';
                        card.onclick = () => selectPair(item.symbol, price);
                        card.innerHTML = `
                            <div class="ticker-symbol">${item.symbol}</div>
                            <div class="ticker-price">$${price}</div>
                            <div style="font-size: 0.75rem;" class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${change}%</div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (e) {
                console.error("Error fetching tickers:", e);
            }
        }

        function selectPair(symbol, price) {
            currentSymbol = symbol;
            currentLivePrice = parseFloat(price);
            document.getElementById('selected-pair').value = symbol;
            document.getElementById('current-price').value = currentLivePrice;
        }

        function executeTrade(type) {
            let amount = parseFloat(document.getElementById('trade-amount').value);
            let leverage = parseInt(document.getElementById('leverage').value);

            if(isNaN(amount) || amount <= 0) {
                alert("Please enter a valid trade amount!");
                return;
            }

            if(amount > balance) {
                alert("Insufficient balance!");
                return;
            }

            balance -= amount;
            document.getElementById('user-balance').innerText = balance.toFixed(2);

            let position = {
                id: Date.now(),
                symbol: currentSymbol,
                type: type,
                entry: currentLivePrice,
                size: amount * leverage
            };

            activePositions.push(position);
            renderPositions();
            sendTelegramAlert(`🚨 New Trade Executed!\nPair: ${currentSymbol}\nType: ${type}\nEntry: $${currentLivePrice}\nSize: $${amount * leverage} (${leverage}x)`);
        }

        function renderPositions() {
            let tbody = document.getElementById('positions-list');
            if(activePositions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No open positions</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            activePositions.forEach((pos, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${pos.symbol}</td>
                        <td class="${pos.type === 'BUY' ? 'positive' : 'negative'}">${pos.type}</td>
                        <td>$${pos.entry}</td>
                        <td>$${pos.size}</td>
                        <td><button style="padding: 3px 8px; background: #da3633; font-size: 0.75rem;" onclick="closePosition(${index})">Close</button></td>
                    </tr>
                `;
            });
        }

        function closePosition(index) {
            let pos = activePositions[index];
            balance += (pos.size / 2); // Simulated return
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            activePositions.splice(index, 1);
            renderPositions();
        }

        function handleTransaction(type) {
            let amt = parseFloat(document.getElementById('wallet-amount').value);
            if(isNaN(amt) || amt <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            if(type === 'Deposit') {
                balance += amt;
                alert(`Successfully deposited $${amt}`);
            } else {
                if(amt > balance) {
                    alert("Withdrawal amount exceeds available balance!");
                    return;
                }
                balance -= amt;
                alert(`Withdrawal request of $${amt} submitted successfully!`);
                sendTelegramAlert(`💸 Withdrawal Request!\nAmount: $${amt}\nRemaining Balance: $${balance}`);
            }
            document.getElementById('user-balance').innerText = balance.toFixed(2);
        }

        function saveTelegramConfig() {
            let token = document.getElementById('tg-token').value;
            let chatId = document.getElementById('tg-chatid').value;
            if(!token || !chatId) {
                alert("Please enter both Bot Token and Chat ID!");
                return;
            }
            localStorage.setItem('tg_token', token);
            localStorage.setItem('tg_chatid', chatId);
            alert("Telegram settings saved successfully!");
            sendTelegramAlert("✅ Telegram Bot Connected Successfully to Crypto Terminal!");
        }

        function sendTelegramAlert(message) {
            let token = localStorage.getItem('tg_token');
            let chatId = localStorage.getItem('tg_chatid');
            if(!token || !chatId) return;

            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message })
            }).catch(err => console.error("Telegram Error:", err));
        }

        // Auto refresh prices every 3 seconds
        setInterval(fetchBitgetPrices, 3000);
        fetchBitgetPrices();
    </script>
</body>
</html>
