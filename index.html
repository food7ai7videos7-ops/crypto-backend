<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Control - Pro Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; display: flex; flex-direction: column; height: 100vh; }
        header { background: #181a20; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2bc15522; }
        .logo { font-size: 20px; font-weight: bold; color: #f0b90b; }
        .wallet-info { font-size: 14px; color: #848e9c; }
        .wallet-info span { color: #0ecb81; font-weight: bold; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: #181a20; border-right: 1px solid #22252a; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .market-list { display: flex; flex-direction: column; gap: 10px; }
        .market-item { background: #21262d; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
        .market-item:hover { background: #30363d; }
        .trading-area { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .card { background: #181a20; padding: 20px; border-radius: 8px; border: 1px solid #22252a; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #848e9c; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0b0e11; border: 1px solid #22252a; color: white; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-buy { background: #0ecb81; color: white; }
        .btn-sell { background: #f6465d; color: white; }
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table th, .table td { padding: 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #22252a; }
        .table th { color: #848e9c; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Trade Control Pro</div>
        <div class="wallet-info">Balance: <span id="user-balance">$10,000.00</span></div>
    </header>

    <div class="main-container">
        <!-- Sidebar Markets -->
        <div class="sidebar">
            <h3>Markets (Bitget Feed)</h3>
            <div class="market-list">
                <div class="market-item" onclick="selectPair('BTC/USDT', 68424)">
                    <span>BTC/USDT</span>
                    <span style="color: #0ecb81;">$68,424</span>
                </div>
                <div class="market-item" onclick="selectPair('ETH/USDT', 3521)">
                    <span>ETH/USDT</span>
                    <span style="color: #0ecb81;">$3,521</span>
                </div>
            </div>

            <div class="card" style="margin-top: auto;">
                <h4>Wallet Withdrawal</h4>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Amount ($)</label>
                    <input type="number" id="withdraw-amount" placeholder="Enter amount">
                </div>
                <div class="form-group">
                    <label>USDT Address</label>
                    <input type="text" id="withdraw-address" placeholder="T... address">
                </div>
                <button class="btn btn-buy" onclick="requestWithdrawal()">Request Withdraw</button>
            </div>
        </div>

        <!-- Main Trading & Admin Panel -->
        <div class="trading-area">
            <div class="card">
                <h2 id="active-pair">BTC/USDT</h2>
                <p style="font-size: 24px; font-weight: bold; margin: 10px 0;" id="active-price">$68,424.18</p>
                
                <div style="display: flex; gap: 15px; margin-top: 15px;">
                    <div style="flex: 1;">
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="number" id="trade-amount" placeholder="0.00" oninput="calculateTotal()">
                        </div>
                        <div class="form-group">
                            <label>Total Estimated ($)</label>
                            <input type="text" id="trade-total" readonly value="0.00">
                        </div>
                        <button class="btn btn-buy" onclick="executeTrade('BUY')">Buy / Long</button>
                    </div>
                    <div style="flex: 1; display: flex; align-items: flex-end;">
                        <button class="btn btn-sell" onclick="executeTrade('SELL')" style="height: 44px;">Sell / Short</button>
                    </div>
                </div>
            </div>

            <!-- History & Admin Requests -->
            <div class="card">
                <h3>Trade History & Pending Withdrawals</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Status</th>
                        </tr>
                    <thead id="history-rows">
                    </thead>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentPair = 'BTC/USDT';
        let currentPrice = 68424.18;

        function selectPair(pair, price) {
            currentPair = pair;
            currentPrice = price;
            document.getElementById('active-pair').innerText = pair;
            document.getElementById('active-price').innerText = '$' + price.toLocaleString();
        }

        function calculateTotal() {
            const amount = document.getElementById('trade-amount').value;
            document.getElementById('trade-total').value = (amount * currentPrice).toFixed(2);
        }

        async function executeTrade(side) {
            const amount = document.getElementById('trade-amount').value;
            if(!amount || amount <= 0) return alert('Enter valid amount');

            const response = await fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: currentPair, side, price: currentPrice, amount })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById('user-balance').innerText = '$' + data.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
                loadState();
                alert('Trade executed successfully!');
            } else {
                alert(data.error);
            }
        }

        async function requestWithdrawal() {
            const amount = document.getElementById('withdraw-amount').value;
            const address = document.getElementById('withdraw-address').value;
            if(!amount || !address) return alert('Fill all withdrawal fields');

            const response = await fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, address })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById('user-balance').innerText = '$' + data.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
                loadState();
                alert(data.message);
            } else {
                alert(data.error);
            }
        }

        async function loadState() {
            const res = await fetch('/api/state');
            const data = await res.json();
            document.getElementById('user-balance').innerText = '$' + data.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
            
            let html = '';
            data.tradeHistory.forEach(t => {
                html += `<tr><td>${t.time}</td><td>${t.side} ${t.symbol}</td><td>$${t.price}</td><td style="color: #0ecb81;">${t.status}</td></tr>`;
            });
            data.withdrawals.forEach(w => {
                html += `<tr><td>${w.time}</td><td>Withdrawal ($${w.amount})</td><td>-</td><td style="color: #f0b90b;">${w.status}</td></tr>`;
            });
            document.getElementById('history-rows').innerHTML = html;
        }

        loadState();
    </script>
</body>
</html>
