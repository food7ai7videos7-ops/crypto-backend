<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Exchanger Terminal - Live Bitget</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: rgba(30, 35, 41, 0.7);
            --card-solid: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-yellow: #f0b90b;
            --border-color: rgba(43, 49, 58, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b0e11 0%, #151a21 100%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--glass-shadow);
        }
        .logo {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }
        .nav-buttons {
            display: flex;
            gap: 5px;
        }
        .nav-buttons button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .nav-buttons button:hover {
            background: rgba(240, 185, 11, 0.15);
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: var(--glass-shadow);
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .value {
            font-weight: 700;
            font-size: 17px;
            color: #fff;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(18, 20, 24, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--accent-yellow);
        }
        .side-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .side-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .side-btn:active { transform: scale(0.98); }
        #buyBtn.active { background: rgba(14, 203, 129, 0.3); border: 1px solid var(--accent-green); color: var(--accent-green); box-shadow: 0 0 15px rgba(14, 203, 129, 0.3); }
        #buyBtn { background: rgba(14, 203, 129, 0.1); border: 1px solid rgba(14, 203, 129, 0.3); color: #0ecb81; }
        #sellBtn.active { background: rgba(246, 70, 93, 0.3); border: 1px solid var(--accent-red); color: var(--accent-red); box-shadow: 0 0 15px rgba(246, 70, 93, 0.3); }
        #sellBtn { background: rgba(246, 70, 93, 0.1); border: 1px solid rgba(246, 70, 93, 0.3); color: #f6465d; }
        
        .execute-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f0b90b 0%, #d4a305 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(240, 185, 11, 0.3);
            transition: opacity 0.2s;
        }
        .execute-btn:hover { opacity: 0.9; }
        .activity-stream {
            font-size: 11px;
            max-height: 110px;
            overflow-y: auto;
            background: rgba(18, 20, 24, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: monospace;
        }
        .activity-item {
            margin-bottom: 5px;
            color: var(--text-muted);
            border-left: 2px solid var(--accent-yellow);
            padding-left: 6px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #181c24;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .modal-content h3 {
            margin-top: 0;
            color: var(--accent-yellow);
            font-size: 18px;
        }
        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 20, 24, 0.8);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }
        .btn-approve {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
        .close-link {
            background: none;
            border: none;
            color: var(--text-muted);
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo"><span></span>PRO EXCHANGER</div>
            <div class="nav-buttons">
                <button onclick="openDepositModal()">Deposit</button>
                <button onclick="openWithdrawModal()" style="color: var(--accent-green); border-color: rgba(14,203,129,0.3);">Withdraw</button>
                <button onclick="openAdminModal()">Admin</button>
            </div>
        </header>

        <!-- Balance Card -->
        <div class="card">
            <div class="balance-row">
                <div>
                    <div class="label">USDT Balance</div>
                    <div class="value" id="usdtBalance">$1.9000</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">Holdings</div>
                    <div class="value" id="holdingsVal">0.0000</div>
                </div>
            </div>
            <div style="margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; justify-content: space-between;">
                <span class="label">Avg Entry Price:</span>
                <span id="avgEntryVal" style="font-size: 13px; font-weight: 700; color: var(--text-main);">$1.4110</span>
            </div>
        </div>

        <!-- Trading Terminal Card -->
        <div class="card">
            <div class="form-group">
                <label>Trading Pair (Live Bitget)</label>
                <select id="tradingSymbol" class="form-control" onchange="updateSymbolSelection()">
                    <option value="BTCUSDT">BTC/USDT</option>
                    <option value="XRPUSDT" selected>XRP/USDT</option>
                    <option value="ETHUSDT">ETH/USDT</option>
                </select>
            </div>

            <div class="balance-row" style="margin-bottom: 16px; background: rgba(18,20,24,0.5); padding: 10px; border-radius: 8px;">
                <span class="label" style="align-self: center;">Live Bitget Price:</span>
                <span id="marketPrice" style="color: var(--accent-green); font-weight: 800; font-size: 16px;">Loading...</span>
            </div>

            <div class="side-btns">
                <button id="buyBtn" class="side-btn active" onclick="setSide('buy')">BUY</button>
                <button id="sellBtn" class="side-btn" onclick="setSide('sell')">SELL</button>
            </div>

            <div class="form-group">
                <label id="sizeLabel">Order Size (USDT Amount)</label>
                <input type="number" id="orderSize" class="form-control" placeholder="Enter amount..." step="any">
            </div>

            <button class="execute-btn" onclick="executeOrder()">EXECUTE BITGET ORDER</button>
        </div>

        <!-- Activity Stream -->
        <div class="card" style="margin-bottom: 0;">
            <div class="label" style="margin-bottom: 8px;">Activity Stream</div>
            <div class="activity-stream" id="activityList">
                <div class="activity-item">[System] Terminal initialized successfully.</div>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h3>Deposit USDT</h3>
            <p class="label" style="margin-bottom: 8px;">Send USDT via TRC20 Network:</p>
            <input type="text" class="form-control" value="0x71C7656EC7a88b098deff75187401B5F6d89B5" readonly style="font-size: 11px; margin-bottom: 10px;">
            <label>Deposited Amount ($)</label>
            <input type="number" id="depositAmountInput" class="form-control" placeholder="10">
            <button class="execute-btn" onclick="submitDeposit()">Submit Deposit Request</button>
            <button class="close-link" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- User Withdrawal Modal -->
    <div id="userWithdrawModal" class="modal">
        <div class="modal-content">
            <h3>Withdraw USDT (TRC20)</h3>
            <div class="form-group" style="margin-top: 10px;">
                <label>Your TRC20 Wallet Address</label>
                <input type="text" id="userWithdrawAddress" class="form-control" placeholder="Enter USDT address">
            </div>
            <div class="form-group">
                <label>Withdraw Amount ($)</label>
                <input type="number" id="userWithdrawAmount" class="form-control" placeholder="0.00">
            </div>
            <button class="execute-btn" onclick="executeUserWithdraw()" style="background: linear-gradient(135deg, #0ecb81 0%, #09935f 100%);">Withdraw Funds</button>
            <button class="close-link" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- Admin Auth Modal -->
    <div id="adminAuthModal" class="modal">
        <div class="modal-content">
            <h3>Admin Authentication</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Admin Password</label>
                <input type="password" id="adminPassInput" class="form-control" placeholder="Enter password">
            </div>
            <button class="execute-btn" onclick="verifyAdmin()">Login Admin Panel</button>
            <button class="close-link" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- Admin Settings Modal -->
    <div id="adminSettingsModal" class="modal">
        <div class="modal-content" style="max-height: 85vh; overflow-y: auto;">
            <h3>Admin Control Panel</h3>
            <div class="form-group" style="margin-top: 10px;">
                <label>Bitget API Key</label>
                <input type="text" id="apiKeyInput" class="form-control">
            </div>
            <div class="form-group">
                <label>Bitget Secret Key</label>
                <input type="password" id="secretKeyInput" class="form-control">
            </div>
            <div class="form-group">
                <label>Bitget Passphrase</label>
                <input type="password" id="passphraseInput" class="form-control">
            </div>
            <div class="form-group">
                <label>Deposit Address</label>
                <input type="text" id="adminDepAddress" class="form-control">
            </div>
            <div class="form-group">
                <label>Min Deposit Limit ($)</label>
                <input type="number" id="adminMinDep" class="form-control">
            </div>
            <div class="form-group">
                <label>Trading Fee (%)</label>
                <input type="number" id="adminFee" class="form-control" step="0.1">
            </div>
            <div class="form-group">
                <label>Accumulated Profit Pool ($)</label>
                <input type="text" id="adminProfitDisplay" class="form-control" readonly style="color: var(--accent-green);">
            </div>
            <div class="form-group">
                <label>Admin Withdrawal Address (TRC20)</label>
                <input type="text" id="withdrawAddressInput" class="form-control" placeholder="USDT TRC20 address">
            </div>
            <div class="form-group">
                <label>Admin Withdraw Amount ($)</label>
                <input type="number" id="withdrawAmountInput" class="form-control" placeholder="0.00">
            </div>
            <button class="execute-btn" onclick="withdrawAdminProfit()" style="background: var(--accent-green); color: #000;">Withdraw Admin Profit</button>
            
            <h4 style="margin: 15px 0 8px 0; font-size: 13px; color: var(--text-muted); text-transform: uppercase;">Pending Deposits</h4>
            <div id="pendingDepositsContainer"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>New Admin Password (Optional)</label>
                <input type="password" id="newAdminPass" class="form-control" placeholder="Leave blank to keep current">
            </div>
            <button class="execute-btn" onclick="saveAdminSettings()">Save Settings</button>
            <button class="close-link" onclick="closeModals()">Close Panel</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://crypto-backend-app.vercel.app';
        let currentSide = 'buy';
        let livePrices = {
            "BTCUSDT": 79700.50,
            "XRPUSDT": 1.4110,
            "ETHUSDT": 2650.00
        };

        let appState = JSON.parse(localStorage.getItem('pro_exchanger_state')) || {
            usdtBalance: 1.90,
            holdings: 0.0000,
            avgEntry: 1.4110,
            adminProfit: 0.01,
            depositAddress: '0x71C7656EC7a88b098deff75187401B5F6d89B5',
            minDeposit: 0.01,
            tradingFee: 5,
            selectedSymbol: 'XRPUSDT',
            pendingDeposits: [],
            activities: ['[System] Terminal initialized successfully.']
        };

        function saveState() {
            localStorage.setItem('pro_exchanger_state', JSON.stringify(appState));
        }

        window.onload = function() {
            document.getElementById('tradingSymbol').value = appState.selectedSymbol || 'XRPUSDT';
            fetchLivePrices();
            setInterval(fetchLivePrices, 3000);
            fetchServerData();
            setInterval(fetchServerData, 3000);
            updateUI();
        };

        async function fetchServerData() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/data`);
                const result = await response.json();
                if (result.success) {
                    appState.pendingDeposits = result.pendingDeposits;
                    appState.adminProfit = result.adminProfit;
                    saveState();
                    updateUI();
                    if (document.getElementById('adminSettingsModal').style.display === 'flex') {
                        renderPendingDeposits();
                        document.getElementById('adminProfitDisplay').value = '$ ' + appState.adminProfit.toFixed(4);
                    }
                }
            } catch(e) {}
        }

        async function fetchLivePrices() {
            try {
                const response = await fetch('https://api.bitget.com/api/v2/spot/market/tickers');
                const data = await response.json();
                if (data && data.data) {
                    data.data.forEach(item => {
                        if (livePrices[item.symbol] !== undefined) {
                            livePrices[item.symbol] = parseFloat(item.lastPr);
                        }
                    });
                }
            } catch (e) {}
            updatePriceDisplay();
        }

        function updateSymbolSelection() {
            appState.selectedSymbol = document.getElementById('tradingSymbol').value;
            saveState();
            updatePriceDisplay();
        }

        function updatePriceDisplay() {
            const symbol = appState.selectedSymbol || document.getElementById('tradingSymbol').value;
            const price = livePrices[symbol] || 1.4110;
            document.getElementById('marketPrice').textContent = '$ ' + price.toFixed(4);
        }

        function setSide(side) {
            currentSide = side;
            const sizeInput = document.getElementById('orderSize');
            const sizeLabel = document.getElementById('sizeLabel');
            
            if (side === 'buy') {
                document.getElementById('buyBtn').classList.add('active');
                document.getElementById('sellBtn').classList.remove('active');
                sizeLabel.textContent = "Order Size (USDT Amount)";
                sizeInput.placeholder = "Enter USDT amount...";
            } else {
                document.getElementById('sellBtn').classList.add('active');
                document.getElementById('buyBtn').classList.remove('active');
                sizeLabel.textContent = "Coin Quantity (e.g. " + appState.holdings.toFixed(4) + ")";
                sizeInput.value = appState.holdings > 0 ? appState.holdings.toFixed(4) : '';
                sizeInput.placeholder = "Enter coin qty to sell...";
            }
        }

        function openDepositModal() { document.getElementById('depositModal').style.display = 'flex'; }
        function openWithdrawModal() { document.getElementById('userWithdrawModal').style.display = 'flex'; }
        function openAdminModal() { document.getElementById('adminAuthModal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        function verifyAdmin() {
            const passInput = document.getElementById('adminPassInput').value;
            const savedPass = localStorage.getItem('adminPassword') || 'admin123';
            if (passInput !== savedPass) {
                alert('Ghalat Password! Baraye karam durust password darj karein.');
                return;
            }
            document.getElementById('adminAuthModal').style.display = 'none';
            document.getElementById('adminSettingsModal').style.display = 'flex';

            document.getElementById('adminDepAddress').value = appState.depositAddress;
            document.getElementById('adminMinDep').value = appState.minDeposit;
            document.getElementById('adminFee').value = appState.tradingFee;
            document.getElementById('adminProfitDisplay').value = '$ ' + (appState.adminProfit || 0).toFixed(4);
            document.getElementById('apiKeyInput').value = localStorage.getItem('bg_apiKey') || '';
            document.getElementById('secretKeyInput').value = localStorage.getItem('bg_secretKey') || '';
            document.getElementById('passphraseInput').value = localStorage.getItem('bg_passphrase') || '';
            renderPendingDeposits();
        }

        function saveAdminSettings() {
            const newPass = document.getElementById('newAdminPass').value;
            if (newPass) {
                localStorage.setItem('adminPassword', newPass);
                alert('Admin password successfully updated!');
            }
            appState.depositAddress = document.getElementById('adminDepAddress').value;
            appState.minDeposit = parseFloat(document.getElementById('adminMinDep').value);
            appState.tradingFee = parseFloat(document.getElementById('adminFee').value);
            localStorage.setItem('bg_apiKey', document.getElementById('apiKeyInput').value);
            localStorage.setItem('bg_secretKey', document.getElementById('secretKeyInput').value);
            localStorage.setItem('bg_passphrase', document.getElementById('passphraseInput').value);

            saveState();
            alert('Settings and API keys saved successfully!');
            closeModals();
        }

        async function executeUserWithdraw() {
            const apiKey = localStorage.getItem('bg_apiKey');
            const secretKey = localStorage.getItem('bg_secretKey');
            const passphrase = localStorage.getItem('bg_passphrase');
            const address = document.getElementById('userWithdrawAddress').value;
            const amount = parseFloat(document.getElementById('userWithdrawAmount').value);

            if (!apiKey || !secretKey || !passphrase) {
                alert('Bitget API keys are not configured in Admin panel!');
                openAdminModal();
                return;
            }
            if (!address || !amount || amount <= 0) {
                alert('Please enter a valid address and withdrawal amount!');
                return;
            }
            if (amount > appState.usdtBalance) {
                alert('Insufficient USDT balance for withdrawal!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, secretKey, passphrase, address, amount })
                });
                const result = await response.json();
                if (result.success) {
                    appState.usdtBalance -= amount;
                    appState.activities.unshift(`[User Withdrawal] $${amount.toFixed(4)} sent to ${address.substring(0,6)}...`);
                    saveState();
                    updateUI();
                    alert(`Success! Withdrawal of $${amount} processed successfully.`);
                    closeModals();
                } else {
                    alert('Withdrawal Error: ' + (result.error || 'Failed'));
                }
            } catch(err) {
                alert('Connection Error: ' + err.message);
            }
        }

        async function withdrawAdminProfit() {
            const apiKey = localStorage.getItem('bg_apiKey');
            const secretKey = localStorage.getItem('bg_secretKey');
            const passphrase = localStorage.getItem('bg_passphrase');
            const address = document.getElementById('withdrawAddressInput').value;
            const amount = parseFloat(document.getElementById('withdrawAmountInput').value);

            if (!apiKey || !secretKey || !passphrase) {
                alert('Please save Bitget API keys first!');
                return;
            }
            if (!address || !amount || amount <= 0) {
                alert('Enter valid address and amount!');
                return;
            }
            if (amount > appState.adminProfit) {
                alert('Amount exceeds accumulated profit pool!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, secretKey, passphrase, address, amount })
                });
                const result = await response.json();
                if (result.success) {
                    appState.adminProfit -= amount;
                    document.getElementById('adminProfitDisplay').value = '$ ' + appState.adminProfit.toFixed(4);
                    appState.activities.unshift(`[Admin Withdrawal] $${amount.toFixed(4)} withdrawn.`);
                    saveState();
                    updateUI();
                    alert(`Success! Profit $${amount} withdrawn successfully.`);
                } else {
                    alert('Error: ' + (result.error || 'Failed'));
                }
            } catch(err) {
                alert('Error: ' + err.message);
            }
        }

        async function submitDeposit() {
            const amt = parseFloat(document.getElementById('depositAmountInput').value);
            if (!amt || amt <= 0) {
                alert('Enter valid deposit amount!');
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amt })
                });
                const result = await response.json();
                if (result.success) {
                    closeModals();
                    alert('Deposit request submitted! Awaiting admin approval.');
                    fetchServerData();
                } else {
                    alert('Error: ' + (result.error || 'Failed'));
                }
            } catch(e) {
                alert('Connection error: Please try again.');
            }
        }

        function renderPendingDeposits() {
            const container = document.getElementById('pendingDepositsContainer');
            if (!appState.pendingDeposits || appState.pendingDeposits.length === 0) {
                container.innerHTML = '<div style="font-size: 11px; color: var(--text-muted);">No pending deposits.</div>';
                return;
            }
            container.innerHTML = '';
            appState.pendingDeposits.forEach((dep, idx) => {
                container.innerHTML += `
                    <div class="pending-item">
                        <span>$${dep.amount} USDT</span>
                        <button class="btn-approve" onclick="approveDeposit(${idx})">Approve</button>
                    </div>
                `;
            });
        }

        async function approveDeposit(idx) {
            const depAmount = appState.pendingDeposits[idx].amount;
            try {
                const response = await fetch(`${API_BASE_URL}/api/approve-deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index: idx })
                });
                const result = await response.json();
                if (result.success) {
                    appState.usdtBalance += depAmount;
                    appState.activities.unshift(`[Deposit Approved] +$${depAmount} USDT`);
                    saveState();
                    updateUI();
                    fetchServerData();
                    alert(`Deposit $${depAmount} approved!`);
                }
            } catch(e) {
                alert('Error approving deposit');
            }
        }

        function updateUI() {
            document.getElementById('usdtBalance').textContent = '$ ' + appState.usdtBalance.toFixed(4);
            document.getElementById('holdingsVal').textContent = appState.holdings.toFixed(4);
            document.getElementById('avgEntryVal').textContent = '$ ' + appState.avgEntry.toFixed(4);

            const list = document.getElementById('activityList');
            list.innerHTML = '';
            if (appState.activities) {
                appState.activities.forEach(act => {
                    list.innerHTML += `<div class="activity-item">${act}</div>`;
                });
            }
        }

        async function executeOrder() {
            const apiKey = localStorage.getItem('bg_apiKey');
            const secretKey = localStorage.getItem('bg_secretKey');
            const passphrase = localStorage.getItem('bg_passphrase');
            const symbol = appState.selectedSymbol || document.getElementById('tradingSymbol').value;
            const sizeInput = parseFloat(document.getElementById('orderSize').value);

            if (!apiKey || !secretKey || !passphrase) {
                alert('Please configure Bitget API Keys in Admin panel first!');
                openAdminModal();
                return;
            }
            if (!sizeInput || sizeInput <= 0) {
                alert('Please enter a valid order size!');
                return;
            }

            const currentPrice = livePrices[symbol] || 1.4110;
            let finalSize = sizeInput;

            if (currentSide === 'buy') {
                if (sizeInput > appState.usdtBalance) {
                    alert('Insufficient USDT balance!');
                    return;
                }
                finalSize = sizeInput; 
            } else {
                if (sizeInput > appState.holdings) {
                    alert('You do not have enough coin holdings to sell this quantity!');
                    return;
                }
                finalSize = sizeInput; 
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/trade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey,
                        secretKey,
                        passphrase,
                        symbol,
                        side: currentSide,
                        size: finalSize.toString()
                    })
                });

                const result = await response.json();
                if (result.success) {
                    let spentUsdt = currentSide === 'buy' ? sizeInput : (finalSize * currentPrice);
                    
                    if (currentSide === 'buy') {
                        appState.usdtBalance -= sizeInput;
                        appState.holdings += (sizeInput / currentPrice);
                    } else {
                        appState.holdings = Math.max(0, appState.holdings - finalSize);
                        appState.usdtBalance += spentUsdt;
                    }

                    appState.avgEntry = currentPrice;
                    const fee = spentUsdt * (appState.tradingFee / 100);
                    appState.adminProfit += fee;

                    appState.activities.unshift(`[Trade] ${currentSide.toUpperCase()} ${symbol} executed! Fee: $${fee.toFixed(4)}`);
                    saveState();
                    updateUI();
                    alert('Success! Order successfully executed on Bitget live market.');
                } else {
                    alert('Bitget Error: ' + (result.error || 'Execution failed'));
                }
            } catch (err) {
                alert('Connection Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
