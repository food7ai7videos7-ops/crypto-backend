<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Exchanger Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-yellow: #f0b90b;
            --border-color: #2b313a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            color: var(--accent-yellow);
        }
        .nav-buttons button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .label {
            color: var(--text-muted);
            font-size: 12px;
        }
        .value {
            font-weight: bold;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background: #121418;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .side-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .side-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        #buyBtn { background-color: #26a69a; opacity: 0.6; }
        #buyBtn.active { opacity: 1; }
        #sellBtn { background-color: #ef5350; opacity: 0.6; }
        #sellBtn.active { opacity: 1; }
        .execute-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .activity-stream {
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
            background: #121418;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .activity-item {
            margin-bottom: 4px;
            color: var(--text-muted);
        }
        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121418;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .btn-approve {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">PRO EXCHANGER</div>
        <div class="nav-buttons">
            <button onclick="openDepositModal()">Deposit</button>
            <button onclick="openAdminModal()">Admin</button>
        </div>
    </div>

    <!-- Balance Card -->
    <div class="card">
        <div class="balance-row">
            <div>
                <div class="label">USDT BALANCE</div>
                <div class="value" id="usdtBalance">$1.9000</div>
            </div>
            <div style="text-align: right;">
                <div class="label">HOLDINGS</div>
                <div class="value" id="holdingsVal">0.0000</div>
            </div>
        </div>
        <div style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; display: flex; justify-content: space-between;">
            <span class="label">Avg Entry Price:</span>
            <span id="avgEntryVal" style="font-size: 13px; font-weight: bold;">$79700.50</span>
        </div>
    </div>

    <!-- Trading Card -->
    <div class="card">
        <div class="form-group">
            <label>Select Trading Pair</label>
            <select id="tradingSymbol" class="form-control" onchange="updateSymbolSelection()">
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="XRPUSDT" selected>XRP/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
            </select>
        </div>

        <div class="balance-row" style="margin-bottom: 12px;">
            <span class="label">Market Price:</span>
            <span id="marketPrice" style="color: var(--accent-green); font-weight: bold;">$1.4110</span>
        </div>

        <div class="side-btns">
            <button id="buyBtn" class="side-btn active" onclick="setSide('buy')">BUY</button>
            <button id="sellBtn" class="side-btn" onclick="setSide('sell')">SELL</button>
        </div>

        <div class="form-group">
            <label>Order Size (USDT or Coin Qty)</label>
            <input type="number" id="orderSize" class="form-control" placeholder="Enter amount..." step="any">
        </div>

        <button class="execute-btn" onclick="executeOrder()">EXECUTE BITGET ORDER</button>
    </div>

    <!-- Activity Stream -->
    <div class="card">
        <div class="label" style="margin-bottom: 6px;">ACTIVITY STREAM</div>
        <div class="activity-stream" id="activityList">
            <div class="activity-item">[System] Terminal initialized successfully.</div>
        </div>
    </div>
</div>

<!-- Deposit Modal -->
<div id="depositModal" class="modal">
    <div class="modal-content">
        <h3>Deposit USDT</h3>
        <p class="label" style="margin-bottom: 10px;">Send USDT to TRC20 Address:</p>
        <input type="text" class="form-control" value="0x71C7656EC7a88b098defFB751B7401B5F6d89B5" readonly style="font-size: 11px; margin-bottom: 12px;">
        <div class="form-group">
            <label>Enter Deposited Amount ($)</label>
            <input type="number" id="depositAmountInput" class="form-control" placeholder="10">
        </div>
        <button class="execute-btn" onclick="submitDeposit()">Submit Deposit</button>
        <button onclick="closeModals()" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Admin Auth Modal -->
<div id="adminAuthModal" class="modal">
    <div class="modal-content">
        <h3>Admin Authentication</h3>
        <div class="form-group" style="margin-top: 15px;">
            <label>Enter Admin Password</label>
            <input type="password" id="adminPassInput" class="form-control" placeholder="Password">
        </div>
        <button class="execute-btn" onclick="verifyAdmin()">Login Admin</button>
        <button onclick="closeModals()" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Admin Settings Modal -->
<div id="adminSettingsModal" class="modal">
    <div class="modal-content" style="max-height: 85vh; overflow-y: auto;">
        <h3>Admin Control Panel</h3>
        <div class="form-group" style="margin-top: 10px;">
            <label>Bitget API Key</label>
            <input type="text" id="apiKeyInput" class="form-control">
        </div>
        <div class="form-group">
            <label>Bitget Secret Key</label>
            <input type="password" id="secretKeyInput" class="form-control">
        </div>
        <div class="form-group">
            <label>Bitget Passphrase</label>
            <input type="password" id="passphraseInput" class="form-control">
        </div>
        <div class="form-group">
            <label>Deposit Address</label>
            <input type="text" id="adminDepAddress" class="form-control">
        </div>
        <div class="form-group">
            <label>Min Deposit Limit ($)</label>
            <input type="number" id="adminMinDep" class="form-control">
        </div>
        <div class="form-group">
            <label>Trading Fee (%)</label>
            <input type="number" id="adminFee" class="form-control" step="0.1">
        </div>
        <div class="form-group">
            <label>Accumulated Admin Profit ($)</label>
            <input type="text" id="adminProfitDisplay" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>Withdraw Profit Address (TRC20)</label>
            <input type="text" id="withdrawAddressInput" class="form-control" placeholder="Enter USDT address">
        </div>
        <div class="form-group">
            <label>Withdraw Amount ($)</label>
            <input type="number" id="withdrawAmountInput" class="form-control" placeholder="0.00">
        </div>
        <button class="execute-btn" onclick="withdrawAdminProfit()" style="background:var(--accent-green); margin-bottom: 10px;">Withdraw Profit</button>

        <h4 style="margin: 15px 0 5px 0; font-size: 14px;">Pending Deposits Approval</h4>
        <div id="pendingDepositsContainer"></div>

        <div class="form-group" style="margin-top: 10px;">
            <label>New Admin Password (Optional)</label>
            <input type="password" id="newAdminPass" class="form-control" placeholder="Leave blank to keep current">
        </div>
        <button class="execute-btn" onclick="saveAdminSettings()">Save Settings</button>
        <button onclick="closeModals()" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Close</button>
    </div>
</div>

<script>
    let currentSide = 'buy';
    
    const prices = {
        "BTCUSDT": 79700.5000,
        "XRPUSDT": 1.4110,
        "ETHUSDT": 2650.0000
    };

    let appState = JSON.parse(localStorage.getItem('pro_exchanger_state')) || {
        usdtBalance: 1.90,
        holdings: 0.0000,
        avgEntry: 1.4110,
        adminProfit: 0.01,
        depositAddress: "0x71C7656EC7a88b098defFB751B7401B5F6d89B5",
        minDeposit: 0.01,
        tradingFee: 5,
        selectedSymbol: "XRPUSDT",
        pendingDeposits: [],
        activities: ["[System] Terminal initialized successfully."]
    };

    function saveState() {
        localStorage.setItem('pro_exchanger_state', JSON.stringify(appState));
    }

    window.onload = function() {
        document.getElementById('tradingSymbol').value = appState.selectedSymbol || "XRPUSDT";
        updatePrice();
        updateUI();
    };

    function updateSymbolSelection() {
        appState.selectedSymbol = document.getElementById('tradingSymbol').value;
        saveState();
        updatePrice();
    }

    function updatePrice() {
        const symbol = appState.selectedSymbol || document.getElementById('tradingSymbol').value;
        const price = prices[symbol] || 1.4110;
        document.getElementById('marketPrice').textContent = '$' + price.toFixed(4);
    }

    function setSide(side) {
        currentSide = side;
        if(side === 'buy') {
            document.getElementById('buyBtn').classList.add('active');
            document.getElementById('sellBtn').classList.remove('active');
        } else {
            document.getElementById('sellBtn').classList.add('active');
            document.getElementById('buyBtn').classList.remove('active');
        }
    }

    function openDepositModal() {
        document.getElementById('depositModal').style.display = 'flex';
    }

    function openAdminModal() {
        document.getElementById('adminAuthModal').style.display = 'flex';
    }

    function verifyAdmin() {
        const passInput = document.getElementById('adminPassInput').value;
        const savedPass = localStorage.getItem('adminPassword') || 'admin123';

        if(passInput !== savedPass) {
            alert('Ghalat Password! Baraye karam durust password darj karein.');
            return;
        }

        document.getElementById('adminAuthModal').style.display = 'none';
        document.getElementById('adminSettingsModal').style.display = 'flex';
        
        document.getElementById('adminDepAddress').value = appState.depositAddress;
        document.getElementById('adminMinDep').value = appState.minDeposit;
        document.getElementById('adminFee').value = appState.tradingFee;
        document.getElementById('adminProfitDisplay').value = '$' + (appState.adminProfit || 0).toFixed(4);
        document.getElementById('apiKeyInput').value = localStorage.getItem('bg_apiKey') || '';
        document.getElementById('secretKeyInput').value = localStorage.getItem('bg_secretKey') || '';
        document.getElementById('passphraseInput').value = localStorage.getItem('bg_passphrase') || '';
        renderPendingDeposits();
    }

    function saveAdminSettings() {
        const newPass = document.getElementById('newAdminPass').value;
        if(newPass) {
            localStorage.setItem('adminPassword', newPass);
            alert('Admin password successfully change ho gaya!');
        }

        appState.depositAddress = document.getElementById('adminDepAddress').value;
        appState.minDeposit = parseFloat(document.getElementById('adminMinDep').value);
        appState.tradingFee = parseFloat(document.getElementById('adminFee').value);
        localStorage.setItem('bg_apiKey', document.getElementById('apiKeyInput').value);
        localStorage.setItem('bg_secretKey', document.getElementById('secretKeyInput').value);
        localStorage.setItem('bg_passphrase', document.getElementById('passphraseInput').value);
        
        saveState();
        alert('Settings aur Bitget API keys successfully update ho gayi!');
        closeModals();
    }

    async function withdrawAdminProfit() {
        const apiKey = localStorage.getItem('bg_apiKey');
        const secretKey = localStorage.getItem('bg_secretKey');
        const passphrase = localStorage.getItem('bg_passphrase');
        const address = document.getElementById('withdrawAddressInput').value;
        const amount = parseFloat(document.getElementById('withdrawAmountInput').value);

        if(!apiKey || !secretKey || !passphrase) {
            alert('Pehle Bitget API keys save karein!');
            return;
        }

        if(!address || !amount || amount <= 0) {
            alert('Baraye karam valid crypto address aur amount darj karein!');
            return;
        }

        if(amount > appState.adminProfit) {
            alert('Aapke profit pool mein itna balance mojood nahi hai!');
            return;
        }

        try {
            const response = await fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey, secretKey, passphrase, address, amount })
            });

            const result = await response.json();
            if(result.success) {
                appState.adminProfit -= amount;
                document.getElementById('adminProfitDisplay').value = '$' + appState.adminProfit.toFixed(4);
                appState.activities.unshift(`[Withdrawal] $${amount.toFixed(4)} sent to ${address.substring(0,6)}...`);
                saveState();
                updateUI();
                alert(`Success! Profit $${amount} successfully aapke crypto address par withdraw ho gaya!`);
            } else {
                alert('Withdrawal Error: ' + (result.error || 'Unknown error'));
            }
        } catch(err) {
            alert('Connection Error: ' + err.message);
        }
    }

    function submitDeposit() {
        const amt = parseFloat(document.getElementById('depositAmountInput').value);
        if(!amt || amt <= 0) {
            alert('Darust amount darj karein!');
            return;
        }
        appState.pendingDeposits.push({ id: Date.now(), amount: amt });
        saveState();
        closeModals();
        alert('Deposit request submit ho gayi! Admin approval ka wait karein.');
    }

    function renderPendingDeposits() {
        const container = document.getElementById('pendingDepositsContainer');
        if(!appState.pendingDeposits || appState.pendingDeposits.length === 0) {
            container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">No pending deposits.</div>';
            return;
        }
        container.innerHTML = '';
        appState.pendingDeposits.forEach((dep, idx) => {
            container.innerHTML += `
                <div class="pending-item">
                    <span>+$${dep.amount} USDT</span>
                    <button class="btn-approve" onclick="approveDeposit(${idx})">Approve</button>
                </div>
            `;
        });
    }

    function approveDeposit(idx) {
        const dep = appState.pendingDeposits.splice(idx, 1)[0];
        appState.usdtBalance += dep.amount;
        
        const actText = `[Deposit Approved] +$${dep.amount} USDT`;
        appState.activities.unshift(actText);
        saveState();
        updateUI();
        renderPendingDeposits();
        alert(`Success! Deposit $${dep.amount} approve ho gaya!`);
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    function updateUI() {
        document.getElementById('usdtBalance').textContent = '$' + appState.usdtBalance.toFixed(4);
        document.getElementById('holdingsVal').textContent = appState.holdings.toFixed(4);
        document.getElementById('avgEntryVal').textContent = '$' + appState.avgEntry.toFixed(4);
        
        const list = document.getElementById('activityList');
        list.innerHTML = '';
        if(appState.activities) {
            appState.activities.forEach(act => {
                list.innerHTML += `<div class="activity-item">${act}</div>`;
            });
        }
    }

    async function executeOrder() {
        const apiKey = localStorage.getItem('bg_apiKey');
        const secretKey = localStorage.getItem('bg_secretKey');
        const passphrase = localStorage.getItem('bg_passphrase');
        const symbol = appState.selectedSymbol || document.getElementById('tradingSymbol').value;
        let sizeInput = parseFloat(document.getElementById('orderSize').value);

        if(!apiKey || !secretKey || !passphrase) {
            alert('Pehle Admin panel mein jaakar apni Bitget API Keys save karein!');
            openAdminModal();
            return;
        }

        if(!sizeInput || sizeInput <= 0) {
            alert('Baraye karam order amount ya quantity darj karein!');
            return;
        }

        const currentPrice = prices[symbol] || 1.4110;
        let finalSize = sizeInput;

        // Smart Auto-Adjustment: Agar user minimum limit ($1.00) se kam amount dale, toh automatically minimum $1.01 ya poori holdings par set karde
        if (currentSide === 'sell') {
            // Agar holdings mojood hain aur user poora ya us se kam bechna chahta hai
            if (sizeInput <= appState.holdings) {
                finalSize = sizeInput; // Coin quantity
            } else {
                // Agar dollar amount dali hai, usko coin quantity mein convert karein
                finalSize = sizeInput / currentPrice;
            }
            // Agar final size ki value $1 se kam ban rahi ho, toh automatic poori holdings (agar hain) ya minimum required size set kardein
            if ((finalSize * currentPrice) < 1.0) {
                if (appState.holdings > 0) {
                    finalSize = appState.holdings; // Automatic poora balance sell par lag jaye ga
                }
            }
        } else {
            // BUY ke liye agar amount $1 se kam hai toh minimum $1.01 kar dein taaki error na aaye
            if (sizeInput < 1.0) {
                sizeInput = 1.01;
            }
            if (sizeInput > appState.usdtBalance) {
                alert('Aapke paas itna USDT balance mojood nahi hai!');
                return;
            }
            finalSize = sizeInput / currentPrice;
        }

        // Decimal formatting for Bitget
        finalSize = parseFloat(finalSize.toFixed(4));

        try {
            const response = await fetch('/api/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    apiKey, 
                    secretKey, 
                    passphrase, 
                    symbol, 
                    side: currentSide, 
                    size: finalSize.toString() 
                })
            });

            const result = await response.json();
            if(result.success) {
                let spentUsdt = currentSide === 'buy' ? sizeInput : (finalSize * currentPrice);
                
                if(currentSide === 'buy') {
                    appState.usdtBalance -= spentUsdt;
                    appState.holdings += finalSize;
                } else {
                    appState.holdings = Math.max(0, appState.holdings - finalSize);
                    appState.usdtBalance += spentUsdt;
                }
                
                appState.avgEntry = currentPrice;
                const fee = spentUsdt * (appState.tradingFee / 100);
                appState.adminProfit += fee;

                const actMsg = `[Trade] ${currentSide.toUpperCase()} ${symbol} executed successfully!`;
                appState.activities.unshift(actMsg);
                saveState();
                updateUI();

                alert(`Trade Status:\nOrder successfully executed on Bitget!`);
            } else {
                alert('Bitget Error: ' + (result.error || 'Order execution failed'));
            }
        } catch(err) {
            alert('Connection Error: ' + err.message);
        }
    }
</script>

</body>
</html>
