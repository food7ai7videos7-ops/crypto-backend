<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO EXCHANGER - Terminal - Live Bitget + Isolated User Balance</title>
    <style>
        :root {
            --card-bg: #161b22;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-yellow: #f0883e;
            --border-color: #30363d;
            --text-muted: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 10px; }
        .container { max-width: 480px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .logo { font-weight: bold; font-size: 16px; color: var(--accent-yellow); display: flex; align-items: center; gap: 8px; }
        .header-btns { display: flex; gap: 8px; }
        .header-btns button { background: #21262d; border: 1px solid var(--border-color); color: #c9d1d9; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .balance-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 20px; font-weight: bold; color: #fff; }
        .trading-pair { margin-bottom: 15px; }
        .trading-pair select { width: 100%; padding: 10px; background: #21262d; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 14px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .price-val { color: var(--accent-green); font-weight: bold; font-size: 18px; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; color: #fff; text-align: center; }
        .action-btn.buy { background: var(--accent-green); opacity: 0.5; }
        .action-btn.buy.active { opacity: 1; }
        .action-btn.sell { background: var(--accent-red); opacity: 0.5; }
        .action-btn.sell.active { opacity: 1; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 10px; background: #21262d; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        .execute-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #f0883e, #d15700); border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
        .activity-stream { background: #0d1117; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; max-height: 120px; overflow-y: auto; font-size: 12px; }
        .activity-item { margin-bottom: 6px; color: var(--text-muted); border-left: 2px solid var(--accent-yellow); padding-left: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); width: 90%; max-width: 400px; border-radius: 8px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; background: #21262d; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🟢 PRO EXCHANGER</div>
            <div class="header-btns">
                <button onclick="openModal('depositModal')">Deposit</button>
                <button onclick="openModal('withdrawModal')">Withdraw</button>
                <button onclick="openModal('adminModal')">Admin</button>
            </div>
        </header>

        <div class="card">
            <div class="balance-row">
                <div>
                    <div class="label">USDT Balance</div>
                    <div class="value" id="usdtBalance">$100.0000</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">Holdings</div>
                    <div class="value" id="holdingsBalance">0.0000</div>
                </div>
            </div>
            <div class="price-row" style="border-top: 1px solid var(--border-color); padding-top: 10px;">
                <span class="label">Avg Entry Price:</span>
                <span id="avgPrice" style="font-weight: bold;">$1.4110</span>
            </div>
        </div>

        <div class="card">
            <div class="trading-pair">
                <label class="label">Trading Pair (Live Bitget)</label>
                <select id="tradingPair">
                    <option value="XRP/USDT">XRP/USDT</option>
                </select>
            </div>
            <div class="price-row">
                <span class="label">Live Bitget Price:</span>
                <span class="price-val" id="livePrice">$1.3864</span>
            </div>
            <div class="action-buttons">
                <button class="action-btn buy active" id="buyBtn" onclick="setSide('buy')">BUY</button>
                <button class="action-btn sell" id="sellBtn" onclick="setSide('sell')">SELL</button>
            </div>
            <div class="form-group">
                <label class="label">Order Size (USDT Amount)</label>
                <input type="number" id="orderSize" class="form-control" placeholder="Enter amount...">
            </div>
            <button class="execute-btn" onclick="executeOrder()">Execute Bitget Order</button>
        </div>

        <div class="card">
            <div class="label" style="margin-bottom: 8px;">Activity Stream</div>
            <div class="activity-stream" id="activityStream">
                <div class="activity-item">[System] Terminal initialized successfully.</div>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Deposit USDT</span>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="label">Deposit Amount (USDT)</label>
                <input type="number" id="depositAmount" class="form-control" placeholder="Enter amount">
            </div>
            <button class="execute-btn" onclick="submitDeposit()">Submit Deposit Request</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Admin Panel</span>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="label">Pending Deposits</label>
                <div id="pendingDepositsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let currentSide = 'buy';
        let livePrice = 1.3864;
        let pendingDeposits = [];

        // Unique User ID generation for session/balance isolation
        let userId = localStorage.getItem('pro_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('pro_user_id', userId);
        }

        let state = {
            balance: 100.00,
            holdings: 0.0000,
            avgPrice: 1.4110
        };

        window.onload = () => {
            fetchData();
            setInterval(fetchData, 4000);
            fetchLivePrice();
            setInterval(fetchLivePrice, 3000);
        };

        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/data?userId=${userId}`);
                const result = await response.json();
                if (result.success) {
                    pendingDeposits = result.pendingDeposits || [];
                    state.balance = result.balance;
                    renderPendingDeposits();
                    updateUI();
                }
            } catch (error) {
                console.error('Connection error');
            }
        }

        async function fetchLivePrice() {
            try {
                const response = await fetch('https://api.bitget.com/api/v2/spot/market/tickers?symbol=XRPUSDT');
                const data = await response.json();
                if (data && data.data && data.data[0]) {
                    livePrice = parseFloat(data.data[0].lastPr);
                    document.getElementById('livePrice').innerText = `$${livePrice.toFixed(4)}`;
                }
            } catch (e) {}
        }

        function setSide(side) {
            currentSide = side;
            if (side === 'buy') {
                document.getElementById('buyBtn').classList.add('active');
                document.getElementById('sellBtn').classList.remove('active');
            } else {
                document.getElementById('sellBtn').classList.add('active');
                document.getElementById('buyBtn').classList.remove('active');
            }
        }

        async function submitDeposit() {
            const amountInput = document.getElementById('depositAmount');
            const amount = parseFloat(amountInput.value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount, userId: userId })
                });
                const result = await response.json();
                if (result.success) {
                    alert('Deposit request submitted! Awaiting admin approval.');
                    amountInput.value = '';
                    closeModal();
                    fetchData();
                } else {
                    alert('Error submitting deposit');
                }
            } catch (e) {
                alert('Connection error.');
            }
        }

        async function approveDeposit(index) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/approve-deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index })
                });
                const result = await response.json();
                if (result.success) {
                    fetchData();
                    alert('Deposit Approved & Credited to user account!');
                }
            } catch (e) {
                alert('Error approving deposit');
            }
        }

        async function executeOrder() {
            const sizeInput = document.getElementById('orderSize');
            const size = parseFloat(sizeInput.value);

            if (!size || size <= 0) {
                alert('Please enter a valid order size!');
                return;
            }

            if (currentSide === 'buy' && size > state.balance) {
                alert('Insufficient USDT balance!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/trade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        symbol: 'XRPUSDT',
                        side: currentSide,
                        size: size
                    })
                });

                const result = await response.json();
                if (result.success) {
                    if (currentSide === 'buy') {
                        state.balance -= size;
                        state.holdings += size / livePrice;
                    } else {
                        state.balance += size;
                        state.holdings = Math.max(0, state.holdings - (size / livePrice));
                    }
                    updateActivity('Order Executed Successfully on Bitget market.');
                    alert('Trade Executed Successfully on Bitget!');
                    sizeInput.value = '';
                    updateUI();
                } else {
                    alert('Execution Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Connection error during trade execution.');
            }
        }

        function updateUI() {
            document.getElementById('usdtBalance').innerText = `$${state.balance.toFixed(4)}`;
            document.getElementById('holdingsBalance').innerText = state.holdings.toFixed(4);
        }

        function updateActivity(text) {
            const stream = document.getElementById('activityStream');
            stream.innerHTML = `<div class="activity-item">[${new Date().toLocaleTimeString()}] ${text}</div>` + stream.innerHTML;
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
            if (id === 'adminModal') renderPendingDeposits();
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        function renderPendingDeposits() {
            const list = document.getElementById('pendingDepositsList');
            if (pendingDeposits.length === 0) {
                list.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">No pending deposits</div>';
                return;
            }
            list.innerHTML = '';
            pendingDeposits.forEach((dep, idx) => {
                list.innerHTML += `<div class="pending-item">
                    <span>User (${dep.userId.slice(0,6)}...): <strong>+$${dep.amount}</strong></span>
                    <button onclick="approveDeposit(${idx})" style="background:var(--accent-green); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Approve</button>
                </div>`;
            });
        }
    </script>
</body>
</html>
